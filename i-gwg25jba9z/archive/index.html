<!DOCTYPE html>
<html lang="zh-Hant" data-theme="light"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow,noarchive">
<title>台灣金融市場日報 · 歷史查詢</title>
<style>:root{
  --paper:#f7f4ee;
  --paper-2:#fffdf8;
  --ink:#1b1a17;
  --ink-2:#4a4740;
  --ink-3:#807b70;
  --rule:#d8d2c4;
  --rule-soft:#e7e2d6;
  --up:#a8322d;      /* 漲：紅（台灣慣例） */
  --down:#2c6b52;    /* 跌：綠 */
  --flat:#807b70;
  --mark:#8a6d1f;
  --band:#efe9dc;
  /* 英數一律 Times New Roman；中文向後備援至 Noto TC / PingFang */
  --serif:"Times New Roman",Times,"Noto Serif TC","Songti TC",serif;
  --sans:"Times New Roman",Times,"Noto Sans TC","PingFang TC",serif;
  --mono:"Times New Roman",Times,"Noto Sans TC","PingFang TC",serif;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --paper:#15171a; --paper-2:#1b1e22; --ink:#ece7dd; --ink-2:#b6b0a5;
    --ink-3:#8b857b; --rule:#33383e; --rule-soft:#262b30;
    --up:#e2685f; --down:#5fb894; --flat:#8b857b; --mark:#d8b45f;
    --band:#20242a;
  }
}
:root[data-theme="dark"]{
  --paper:#15171a; --paper-2:#1b1e22; --ink:#ece7dd; --ink-2:#b6b0a5;
  --ink-3:#8b857b; --rule:#33383e; --rule-soft:#262b30;
  --up:#e2685f; --down:#5fb894; --flat:#8b857b; --mark:#d8b45f;
  --band:#20242a;
}

*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{
  margin:0; background:var(--paper); color:var(--ink);
  font-family:var(--sans); font-weight:400; font-size:16.5px; line-height:1.7;
  font-variant-numeric:lining-nums tabular-nums;
  -webkit-font-smoothing:antialiased;
  background-image:
    radial-gradient(circle at 12% 8%, rgba(0,0,0,.025), transparent 45%),
    radial-gradient(circle at 88% 4%, rgba(0,0,0,.02), transparent 40%);
}
.sheet{max-width:940px;margin:0 auto;padding:0 22px 72px}

/* ── 工具列 ───────────────────────── */
.toolbar{
  position:sticky;top:0;z-index:50;
  display:flex;justify-content:flex-end;gap:8px;flex-wrap:wrap;
  padding:10px 0 9px;margin-bottom:-4px;
  background:color-mix(in srgb, var(--paper) 88%, transparent);
  backdrop-filter:saturate(140%) blur(8px);
  -webkit-backdrop-filter:saturate(140%) blur(8px);
}
.btn{
  font-family:var(--mono);font-size:12.5px;letter-spacing:.06em;
  color:var(--ink-2);background:var(--paper-2);
  border:1px solid var(--rule);border-radius:2px;
  padding:7px 13px;cursor:pointer;line-height:1.4;
  transition:border-color .15s, color .15s, background .15s;
}
.btn:hover{border-color:var(--ink);color:var(--ink)}
.btn:active{background:var(--band)}
.btn:focus-visible{outline:2px solid var(--mark);outline-offset:2px}
.toast{
  position:fixed;left:50%;bottom:28px;transform:translateX(-50%) translateY(12px);
  background:var(--ink);color:var(--paper);font-family:var(--mono);font-size:13.5px;
  padding:10px 18px;border-radius:2px;opacity:0;pointer-events:none;
  transition:opacity .22s, transform .22s;z-index:99;max-width:86vw;text-align:center;
}
.toast.on{opacity:1;transform:translateX(-50%) translateY(0)}

/* ── 報頭 ─────────────────────────── */
.masthead{padding:38px 0 16px;border-bottom:2.5px solid var(--ink)}
.kicker{
  font-family:var(--mono);font-size:11.5px;letter-spacing:.22em;text-transform:uppercase;
  color:var(--ink-3);display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;
}
h1{
  font-family:var(--serif);font-weight:700;font-size:clamp(30px,5.4vw,48px);
  line-height:1.12;letter-spacing:.01em;margin:12px 0 6px;
}
h1 .thin{font-weight:400;color:var(--ink-2)}
.dateline{
  font-family:var(--mono);font-size:14px;color:var(--ink-2);
  display:flex;gap:18px;flex-wrap:wrap;align-items:baseline;margin-bottom:14px;
}
.dateline b{color:var(--ink);font-weight:600}
.standfirst{
  font-family:var(--serif);font-size:17.5px;line-height:1.72;color:var(--ink-2);
  max-width:64ch;margin:0 0 22px;
}

/* ── 速覽 ─────────────────────────── */
/* 格線改由各卡片自己畫，不用「容器底色透出縫隙」的手法——
   卡片數為奇數時，最後一個空格會露出容器灰底，看起來像壞掉的空卡。*/
.glance{
  display:grid;grid-template-columns:repeat(auto-fit,minmax(132px,1fr));
  gap:0;border-top:1px solid var(--rule);border-left:1px solid var(--rule);
  margin:0 0 34px;
}
.g{background:var(--paper-2);padding:13px 14px 12px;
  border-right:1px solid var(--rule);border-bottom:1px solid var(--rule)}
.g .lab{font-family:var(--mono);font-size:11px;letter-spacing:.14em;color:var(--ink-3);text-transform:uppercase}
.g .val{font-family:var(--mono);font-size:21px;font-weight:600;letter-spacing:-.01em;margin-top:4px;font-variant-numeric:tabular-nums}
.g .chg{font-family:var(--mono);font-size:13px;margin-top:2px;font-variant-numeric:tabular-nums}

/* ── 章節 ─────────────────────────── */
section{margin:0 0 42px;scroll-margin-top:16px}
.shead{display:flex;align-items:baseline;gap:14px;border-bottom:1px solid var(--ink);padding-bottom:7px;margin-bottom:4px}
.snum{
  font-family:var(--serif);font-size:34px;font-weight:400;line-height:1;
  color:var(--ink-3);min-width:38px;
}
/* 章節標題與序號同級（桌機 34px／手機 27px），兩處數值須與 .snum 同步調整 */
.shead h2{font-family:var(--serif);font-size:34px;font-weight:700;letter-spacing:.02em;margin:0;flex:1;line-height:1.15}
.shead .tag{font-family:var(--mono);font-size:11px;letter-spacing:.16em;color:var(--ink-3);text-transform:uppercase}

/* ── 表格 ─────────────────────────── */
.wrap{overflow-x:auto;-webkit-overflow-scrolling:touch}
table{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums}
caption{text-align:left;font-family:var(--mono);font-size:11.5px;letter-spacing:.14em;
  text-transform:uppercase;color:var(--ink-3);padding:14px 0 8px}
/* 表頭字級與表格內容（td 15px）相同；原 11.5px 過小。字距同步收小，避免寬表被撐開 */
th{
  font-family:var(--mono);font-weight:700;font-size:15px;letter-spacing:.02em;
  text-transform:uppercase;color:var(--ink-3);text-align:right;
  padding:10px 10px 8px;border-bottom:1px solid var(--rule);white-space:nowrap;
}
th:first-child{text-align:left;padding-left:0}
td{
  padding:11px 10px;border-bottom:1px solid var(--rule-soft);
  font-family:var(--mono);font-size:15px;text-align:right;white-space:nowrap;
}
td:first-child{
  text-align:left;padding-left:0;font-family:var(--sans);font-size:15.5px;
  font-weight:500;white-space:normal;
}
tbody tr:hover td{background:var(--band)}
.px{font-size:16.5px;font-weight:700}
.up{color:var(--up)}
.down{color:var(--down)}
.flat{color:var(--flat)}
.dim{color:var(--ink-3);font-size:13.5px}
.note{
  font-size:14.5px;line-height:1.62;color:var(--ink-2);
  padding:9px 0 13px 16px;border-left:2px solid var(--rule);
  margin:-2px 0 14px 0;background:transparent;
}
.note b{color:var(--ink);font-weight:500}
tr.sub td{border-bottom:none;padding-top:0;padding-bottom:12px}
tr.sub td .note{margin:0;padding-bottom:0}
.spread-row td:first-child{font-weight:700}
.spread-row td{background:var(--band)}

/* ── 事件時間軸 ────────────────────── */
.events{list-style:none;margin:14px 0 0;padding:0}
.events li{
  display:grid;grid-template-columns:152px 1fr;gap:16px;
  padding:14px 0;border-bottom:1px solid var(--rule-soft);
}
.events .when{font-family:var(--mono);font-size:14px;color:var(--ink-2);line-height:1.5}
.events .when b{display:block;color:var(--ink);font-size:15px;font-weight:600}
.events .what{font-size:15.5px}
.events .what .sub{display:block;color:var(--ink-2);font-size:14.5px;margin-top:3px}
.events li.hot .when b{color:var(--up)}

/* ── Fed 機率條 ────────────────────── */
.probs{margin-top:16px}
.bar{display:flex;height:32px;border:1px solid var(--rule);overflow:hidden;font-family:var(--mono)}
.bar span{
  display:flex;align-items:center;justify-content:center;
  font-size:13px;font-weight:700;letter-spacing:.02em;color:var(--paper-2);
  /* 窄區塊絕不可折行或溢出，否則會像「維持不變 12.7%」那樣被截斷 */
  white-space:nowrap;overflow:hidden;padding:0 4px;min-width:0;
}
.bar .b1{flex:70;background:var(--up)}
.bar .b2{flex:30;background:var(--ink-3)}
.bar .b3{flex:0.6;background:var(--rule);color:var(--ink-3)}
.legend{
  display:flex;gap:20px;flex-wrap:wrap;margin-top:9px;
  font-family:var(--mono);font-size:12.5px;color:var(--ink-2);
}
.legend i{display:inline-block;width:10px;height:10px;margin-right:6px;vertical-align:-1px}
.legend span{display:inline-flex;align-items:center}

/* ── 觀察重點 ───────────────────────── */
/* 三欄都是中文敘述，必須可折行並固定比例分配；
   否則門檻欄（繼承通用 nowrap）會獨佔寬度，把「意義」欄壓到只剩幾十 px。*/
.watch{table-layout:fixed}
.watch td{white-space:normal;vertical-align:top}
.watch th:first-child,.watch td:first-child{width:26%}
.watch th:nth-child(2),.watch td:nth-child(2){width:20%;text-align:left}
.watch th:last-child,.watch td:last-child{width:54%;text-align:left}
.watch td:nth-child(2){font-weight:600;color:var(--mark);font-family:var(--mono)}
.watch td:last-child{font-family:var(--sans);font-size:14.5px;color:var(--ink-2)}
.watch th:nth-child(2),.watch th:last-child{text-align:left}

/* ── 來源／頁尾 ─────────────────────── */
.sources{border-top:2.5px solid var(--ink);margin-top:52px;padding-top:18px}
.sources h3{font-family:var(--mono);font-size:11.5px;letter-spacing:.2em;text-transform:uppercase;color:var(--ink-3);margin:0 0 12px;font-weight:500}
.sources ol{margin:0;padding-left:20px}
.sources li{font-size:14px;line-height:1.6;margin-bottom:9px;color:var(--ink-2)}
.sources a{color:var(--ink);text-decoration:none;border-bottom:1px solid var(--rule);word-break:break-all}
.sources a:hover{border-bottom-color:var(--ink)}
.colophon{
  margin-top:26px;padding-top:16px;border-top:1px solid var(--rule);
  font-size:13px;line-height:1.66;color:var(--ink-3);
}
.colophon .disc{font-family:var(--serif);font-size:13.5px;color:var(--ink-2)}
.keyline{
  display:flex;gap:16px;flex-wrap:wrap;font-family:var(--mono);font-size:12px;
  color:var(--ink-3);letter-spacing:.06em;margin-top:10px;
}
.keyline i{display:inline-block;width:9px;height:9px;margin-right:5px;vertical-align:-1px}

@media (max-width:600px){
  body{font-size:15.5px}
  /* 手機比例實測：26/28/46 時最高列 3 行；門檻欄再窄（22%）會讓長門檻折成 5 行 */
  .watch th:first-child,.watch td:first-child{width:26%}
  .watch th:nth-child(2),.watch td:nth-child(2){width:28%}
  .watch th:last-child,.watch td:last-child{width:46%}
  .watch td{font-size:13.5px;padding-left:6px;padding-right:6px}
  .watch td:last-child{font-size:13.5px}
  .sheet{padding:0 16px 56px}
  .snum{font-size:27px;min-width:30px}
  .shead h2{font-size:27px}
  .events li{grid-template-columns:1fr;gap:5px}
  td,th{padding-left:8px;padding-right:8px}
}
.pfoot{display:none}

/* ── 通用條列（無法表格化的章節）──────────── */
.plain{list-style:none;margin:14px 0 0;padding:0}
.plain li{padding:11px 0;border-bottom:1px solid var(--rule-soft)}
.plain li:last-child{border-bottom:none}
.plain .it{display:block;font-size:15.5px;line-height:1.62}
.plain .note{margin:7px 0 0;padding-bottom:0}

/* 機率條圖例色塊 */
.legend i.b1{background:var(--up)}
.legend i.b2{background:var(--ink-3)}
.legend i.b3{background:var(--down)}
.bar .b3{background:var(--down)}

/* 指數／殖利率表：首欄名稱不折行，數值才對得齊 */
.tight td:first-child{white-space:nowrap}
/* 無法欄位化的原句（如 VIX 各日寫法不一），整段照登 */
td.freetext{text-align:left;white-space:normal;font-family:var(--sans);
  font-size:14px;line-height:1.55}

/* 機率條：未載明的部分（不做推算，據實標示） */
.bar .b0{background:repeating-linear-gradient(45deg,var(--rule) 0 6px,var(--rule-soft) 6px 12px);
  color:var(--ink-3)}
.legend i.b0{background:repeating-linear-gradient(45deg,var(--rule) 0 4px,var(--rule-soft) 4px 8px)}
/* 殖利率表天期欄：收窄，把寬度讓給數值欄 */
.tight th:first-child,.tight td:first-child{width:1%}

/* 機率條標題（來源與時間戳）*/
.probcap{font-family:var(--mono);font-size:11.5px;letter-spacing:.12em;
  text-transform:uppercase;color:var(--ink-3);padding:0 0 8px}

/* ── 台灣金融市場日報：追加樣式 ───────────────────────── */
.banner{border:1px solid var(--mark);background:var(--band);color:var(--ink);
  border-radius:6px;padding:.6rem .9rem;margin:1rem 0;font-size:.94rem;line-height:1.6}
.banner b{color:var(--mark)}
.note{color:var(--ink-3);font-size:.86rem;line-height:1.6;margin:.35rem 0 0}
.tbl-wrap{overflow-x:auto;-webkit-overflow-scrolling:touch}
table.data{width:100%;border-collapse:collapse;margin:.5rem 0 .2rem;font-size:.95rem}
table.data th,table.data td{border-bottom:1px solid var(--rule-soft);padding:.45rem .55rem;
  white-space:nowrap;text-align:right}
table.data th{color:var(--ink-2);font-weight:600;border-bottom:1px solid var(--rule);text-align:right}
table.data th:first-child,table.data td:first-child{text-align:left}
table.data tr:last-child td{border-bottom:none}
table.data tr.total td{font-weight:700;border-top:1px solid var(--rule)}
.stale{color:var(--ink-3)}
.sum li{margin:.3rem 0;line-height:1.7}

/* 關於本頁：來歷說明，字級小於正文但需清楚可讀。
   變數須用本檔實際定義者：--rule（線）／--ink-3（次要字）／--band（淡底），
   不可自創 --line/--muted/--bg-soft，未定義的 var() 會讓 border-color 退回 currentColor。 */
.about{margin:28px 0 0;padding:16px 18px;border:1px solid var(--rule);border-radius:6px;
       background:var(--band)}
.about h2{margin:0 0 10px;font-size:1.02em;letter-spacing:.04em;border:0;padding:0}
.about dl{margin:0;display:grid;grid-template-columns:5.6em 1fr;gap:6px 14px}
.about dt{font-weight:600;color:var(--ink-3)}
.about dd{margin:0;line-height:1.65;min-width:0;overflow-wrap:anywhere}
.about a{color:inherit}
@media(max-width:520px){.about dl{grid-template-columns:1fr;gap:2px 0}
  .about dd{margin:0 0 8px}}

/* 跨欄的單值列（如匯率的開盤／盤中高低／成交金額）靠左 */
table.data td.lft{text-align:left}
/* 整張表都是文字敘述者（如未來關鍵事件）表頭與內容一律靠左 */
table.data.lftall th,table.data.lftall td{text-align:left}

/* 螢幕版：表格放在與速覽卡片同色的白底框內（紙本不套用，維持 A4 兩頁版面） */
@media screen{
  .tbl-wrap{background:var(--paper-2);border:1px solid var(--rule);margin:.5rem 0 .2rem}
  .tbl-wrap table.data{margin:0}
  .secs .blk{padding-bottom:26px}
}

/* ── 列印版：A4 直式、最多 2 頁（給長官參閱的紙本）──────────
   不是網頁原樣套印：隱藏工具列／速覽卡片／關於本頁，字級縮到 9.5–10pt，小表兩兩併排。
   本段須置於檔尾，才能蓋過前面同權重的 table.data／.note 規則。版面以 headless Chrome 列印 + pdfinfo 驗證頁數。 */
@media print{
  @page{size:A4;margin:10mm 12mm}
  /* :root 疊三次以提高權重，蓋過深色模式的 :root[data-theme="dark"]，紙本一律白底黑字 */
  :root:root:root{--paper:#fff;--paper-2:#fff;--ink:#000;--ink-2:#222;--ink-3:#555;
    --rule:#999;--rule-soft:#ccc;--band:#f1f1f1;--up:#b0201a;--down:#1d6b45;--mark:#7a5a00}
  html,body{background:#fff !important;background-image:none !important}
  body{font-size:10pt;line-height:1.4;-webkit-print-color-adjust:exact;print-color-adjust:exact}
  .sheet{max-width:none;padding:0}
  .toolbar,.toast,.glance,.about{display:none !important}
  .masthead{padding:0 0 3pt;border-bottom:1.5pt solid #000;display:flex;align-items:baseline;gap:10pt}
  .kicker{display:none}
  h1{font-size:18pt;margin:0}
  .dateline{font-size:10pt;margin:0}
  .banner{margin:4pt 0;padding:2pt 6pt;font-size:8pt;border-radius:0}
  section{margin:0;break-inside:avoid}
  .shead{gap:5pt;padding-bottom:1pt;margin:5pt 0 1pt;border-bottom:.8pt solid #000;break-after:avoid}
  /* 字級階層：報名 18pt ＞ 章節標題 14pt ＞ 小標 11pt ＞ 內文 10pt ＞ 表格 9.5pt（使用者指定標題比內容大一級） */
  .snum,.shead h2{font-size:14pt;min-width:0}
  .shead .tag{display:none}
  .blk h3{font-size:11pt;margin:2pt 0 0;line-height:1.3}
  .blk b,td b{font-weight:700}
  .sum{margin:3pt 0 0;padding-left:13pt}
  .sum li{margin:1pt 0;line-height:1.4;font-size:10pt}
  .tbl-wrap,.wrap{overflow:visible}
  table.data{margin:1pt 0 0;font-size:9.5pt}
  table.data th,table.data td{padding:1.1pt 4pt;font-size:9.5pt;line-height:1.3}
  table.data th:first-child,table.data td:first-child{padding-left:0}
  td:first-child{font-size:9.5pt}
  tbody tr:hover td{background:none}
  .note{font-size:7pt;line-height:1.3;margin:1pt 0 0;padding:0 0 0 5pt;border-left:1pt solid #bbb}
  /* 不用整頁 grid：Safari 對 grid 內分頁控制支援不全。小表併排改由各節內的 .pair 負責 */
  .secs{display:block}
  .pair{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);column-gap:12pt;align-items:start}
  .blk{break-inside:avoid;min-width:0}
  /* 半欄表格：固定版面、表頭與數值可折行，任何字型下都不會寬過欄位；
     右欄再留 6pt 安全邊，避免印表機實體邊界吃掉最右一欄（RP 變動曾被截，2026-09-14） */
  .pair table.data{table-layout:fixed;width:100%}
  /* 權重須高於 table.data th/td 的 nowrap（0,1,2），否則字放大時表頭互相重疊 */
  .pair table.data th,.pair table.data td{white-space:normal;overflow-wrap:anywhere}
  .pair table.data th:first-child,.pair table.data td:first-child{width:34%}
  /* 央行決議句、事件名稱為長文字，紙本允許折行 */
  #cbc td,#calendar td{white-space:normal}
  #cbc td:first-child,#calendar td:first-child{white-space:nowrap}
  #bond,#stock,#rates,#fx,#history,#econ,#cbc,#calendar{padding-right:6pt}
  /* 使用者指定：「近期走勢」起換到第 2 頁（2026-09-14；台股併節後為第五節） */
  /* 第 2 頁全為全寬表，改一般區塊：Safari 對 grid 內的分頁控制（break-inside）支援不全，會把表格列切半 */
  .secs.secs-p2{display:block;break-before:page;page-break-before:always}
  /* 頁碼（使用者指定右下角）：@page 邊界盒，Chrome／Edge 支援；使用者表示 Safari 不顯示無妨（2026-09-15） */
  @page{@bottom-right{content:counter(page) " / " counter(pages);font-family:"Times New Roman",serif;font-size:8pt;color:#444}}
  tr{break-inside:avoid;page-break-inside:avoid}
  /* 使用者指定紙本不印這三節的註解（2026-09-14） */
  .part-inst .note,#fx .note,#econ .note{display:none}
  .pfoot{display:block;margin:6pt 0 0;padding-top:2pt;border-top:.6pt solid #999;font-size:7pt;color:#444}
}


.arc{list-style:none;padding:0;margin:.4rem 0 0;display:grid;
  grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:.4rem}
.arc a{display:block;padding:.45rem .6rem;border:1px solid var(--rule-soft);
  border-radius:5px;text-decoration:none;color:var(--ink);font-variant-numeric:tabular-nums}
.arc a:hover{border-color:var(--ink)}
.mon{margin:1.2rem 0}
.mon h3{font-size:15px;color:var(--ink-2);margin:0;border-bottom:1px solid var(--rule);padding-bottom:.3rem}
#q{width:100%;max-width:320px;padding:.5rem .6rem;border:1px solid var(--rule);
  border-radius:5px;background:var(--paper-2);color:var(--ink);font:inherit}
</style></head>
<body>
<div class="toolbar"><a class="btn" href="../">← 回最新一期</a></div>
<main class="sheet">
<header class="masthead"><p class="kicker">Archive</p>
<h1>歷史查詢</h1><p class="dateline"><b id="cnt">共 6 期</b></p></header>
<p><input id="q" type="search" placeholder="輸入 2026-09 / 09-11 / 完整日期，Esc 清除"></p>
<div id="list"><section class="mon" data-ym="2026-09"><h3>2026-09</h3><ul class="arc"><li data-key="2026-09-17"><a href="2026-09-17.html">2026-09-17</a></li><li data-key="2026-09-16"><a href="2026-09-16.html">2026-09-16</a></li><li data-key="2026-09-15"><a href="2026-09-15.html">2026-09-15</a></li><li data-key="2026-09-14"><a href="2026-09-14.html">2026-09-14</a></li><li data-key="2026-09-11"><a href="2026-09-11.html">2026-09-11</a></li><li data-key="2026-09-10"><a href="2026-09-10.html">2026-09-10</a></li></ul></section></div>
</main>
<script>
(function(){
  var q=document.getElementById('q'), cnt=document.getElementById('cnt'),
      total=6, lis=[].slice.call(document.querySelectorAll('.arc li'));
  function apply(){
    var v=q.value.trim(), n=0;
    lis.forEach(function(li){
      var ok = !v || li.dataset.key.indexOf(v) !== -1;
      li.style.display = ok ? '' : 'none';
      if(ok) n++;
    });
    document.querySelectorAll('.mon').forEach(function(s){
      s.style.display = [].slice.call(s.querySelectorAll('li'))
        .some(function(li){return li.style.display !== 'none';}) ? '' : 'none';
    });
    cnt.textContent = v ? ('顯示 ' + n + ' / ' + total + ' 期') : ('共 ' + total + ' 期');
  }
  q.addEventListener('input', apply);
  q.addEventListener('keydown', function(e){ if(e.key==='Escape'){ q.value=''; apply(); } });
})();
</script>
</body></html>
